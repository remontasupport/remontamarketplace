# CI for the Remonta application (apps/app).
#
# Split from the marketing workflow deliberately (U6 D4=B). Path filters mean a
# marketing-only change does not run this app's 41 tests, and the check names
# stay distinct so branch protection can require each product independently.
#
# Runs the checks Vercel does not: the type and lint baselines from U1 and the
# test suite from U2. It does not build -- Vercel already builds every push and
# pull request and never promotes a failure.
#
# No secrets required: `pnpm run quality` was verified to pass with every
# environment variable unset.

name: CI (app)

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-app.yml"

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: App Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.x is what developers run today; 22.x is the intended target.
        # Running both proves the pending Node upgrade rather than assuming it.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm before setup-node -- setup-node's pnpm cache needs the binary first.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Install the whole workspace: apps/app may depend on packages/* from U7
      # onward, and --frozen-lockfile fails if package.json has drifted.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # type-check:baseline -- fails only on type errors absent from
      #                        apps/app/.quality-baseline/typescript.txt (149 known)
      # lint:baseline       -- same for ESLint (523 known)
      # test                -- Vitest, unit and property-based (41)
      - name: Quality gate
        run: pnpm --filter @remonta/app run quality
