# Build → registry → deploy for apps/api (deployment-architecture.md §2, amended D10).
#
#   push to main (api, packages, infra, lockfile)  →  quality  →  build image :<sha>  →  deploy STAGING
#   workflow_dispatch (stage, imageTag)            →  promote an EXISTING image to staging or prod
#
# Production never deploys on a push. It is a promotion of an image that already
# runs on staging and has passed the preview checklist
# (aidlc-docs/construction/plans/S1-preview-first-verification-plan.md §3).
# The same dispatch with an older SHA is the rollback for either stage: images stay
# in ECR (last 20), so a rollback is a redeploy, never a rebuild.
#
# Trust: OIDC → the role from RemontaGithubOidc (repository variable AWS_DEPLOY_ROLE_ARN),
# assumable only from this repository on main. No long-lived AWS keys anywhere.
# Gate: the api and infra quality gates re-run here before an image is built (the
# database-backed suites skip without TEST_DATABASE_URL; ci-api.yml runs them on the PR).
# Optional hardening (user): a GitHub environment `production` with required reviewers;
# the promote job declares it.

name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "infra/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Which deployment to update"
        type: choice
        required: true
        default: staging
        options: [staging, prod]
      imageTag:
        description: "Git SHA of an image already in ECR (the one that passed the checklist; an older one = rollback)"
        type: string
        required: true

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: remonta-api

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (api, infra)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API quality gate (no database here; ci-api.yml runs the PostGIS suites on the PR)
        run: pnpm --filter @remonta/api run quality
      - name: Infra quality gate
        run: pnpm --filter @remonta/infra run quality

  # ---------------------------------------------------------------------------
  build-push:
    name: Build and push remonta-api:${{ github.sha }}
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      imageTag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, SBOM + provenance) and push
        run: |
          docker buildx build \
            -f apps/api/Dockerfile \
            --platform linux/amd64 \
            --sbom=true --provenance=true \
            --push \
            -t "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            .

  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging (${{ github.sha }})
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy RemontaApiStaging
        run: pnpm --filter @remonta/infra exec cdk deploy RemontaApiStaging --require-approval never -c imageTag=${{ needs.build-push.outputs.imageTag }}
      - name: Wait for the service to settle, then check health
        run: .github/scripts/api-health.sh staging

  # ---------------------------------------------------------------------------
  promote:
    name: Promote ${{ inputs.imageTag }} to ${{ inputs.stage }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `production` may carry required reviewers in the repository settings; `staging` needs none.
    environment: ${{ inputs.stage == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: The image must already exist (no build on a promotion)
        run: aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ inputs.imageTag }}" --query 'imageDetails[0].imagePushedAt' --output text
      - name: cdk deploy
        run: |
          case "${{ inputs.stage }}" in
            prod) stack=RemontaApiProd ;;
            staging) stack=RemontaApiStaging ;;
            *) echo "unknown stage"; exit 1 ;;
          esac
          pnpm --filter @remonta/infra exec cdk deploy "$stack" --require-approval never -c imageTag=${{ inputs.imageTag }}
      - name: Wait for the service to settle, then check health
        run: .github/scripts/api-health.sh ${{ inputs.stage }}
