# CI for the Remonta marketing site (main).
#
# The counterpart of the workflow on app/main, with one meaningful difference:
# this product has ZERO TypeScript errors, so `type-check` runs tsc STRICTLY and
# fails on any error at all. No baseline is needed or wanted here. Only ESLint
# has a baseline (76 known errors), because those have not been cleared yet.
#
# There is no test step. U2 established Vitest on app/main only; when it is
# applied here, `quality` picks it up without this file changing.
#
# It deliberately does NOT build. Vercel already builds every push and pull
# request as a preview deployment and never promotes a failed build.
#
# No secrets are required.

name: CI

on:
  pull_request:
    branches: [main, app/main]
  push:
    branches: [main, app/main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.x matches local development today; 22.x is the intended target.
        # Running both proves the pending Node upgrade rather than assuming it.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # postinstall runs `prisma generate`, which succeeds without a database URL.
      - name: Install dependencies
        run: npm ci

      # type-check    -- strict tsc, zero tolerance (this product has 0 errors)
      # lint:baseline -- fails only on ESLint errors absent from
      #                  .quality-baseline/eslint.txt (76 known)
      - name: Quality gate
        run: npm run quality

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # REPORT ONLY, matching app/main. Failing on the existing backlog would
      # block every pull request. Tighten to `--audit-level=critical` without
      # continue-on-error once the criticals are triaged.
      - name: Dependency audit (report only)
        continue-on-error: true
        run: |
          echo "::group::npm audit summary"
          npm audit || true
          echo "::endgroup::"
          echo "Audit is REPORT ONLY. See aidlc-docs/construction/U3/code/U3-summary.md."

      # SECURITY-10: Software Bill of Materials. `npm sbom` ships with npm 10.
      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-marketing
          path: sbom.cyclonedx.json
          retention-days: 90
